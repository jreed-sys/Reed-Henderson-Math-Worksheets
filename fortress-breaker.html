<title>Fortress Breaker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#05060d;
    --bg-deep:#020208;
    --ship:#4be3ff;
    --ship-glow:rgba(75,227,255,.55);
    --ring-outer:#ff7a3d;
    --ring-mid:#c46bff;
    --ring-inner:#ffe14d;
    --core:#ff2f5e;
    --mine:#ff5b8a;
    --text:#eaf4ff;
    --muted:#6f7ba0;
    --panel:#0a0e1c;
    --panel-border:#2c3560;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Mono',ui-monospace,monospace;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
    touch-action:none;
  }
  #game{
    position:fixed;
    inset:0;
    display:block;
    width:100vw;
    height:100vh;
    background:radial-gradient(ellipse at 50% 45%, #0c1024 0%, var(--bg-deep) 70%);
  }
  #hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    padding:18px 22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    font-size:13px;
    letter-spacing:1px;
  }
  #hud .col{display:flex;flex-direction:column;gap:6px;}
  #hud .label{color:var(--muted);font-size:10px;letter-spacing:2px;}
  #hud .value{color:var(--text);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(234,244,255,.35);}
  #hud .col.right{align-items:flex-end;}
  #wave-badge{
    position:fixed;
    top:18px;left:50%;
    transform:translateX(-50%);
    text-align:center;
    color:var(--muted);
    font-size:11px;
    letter-spacing:3px;
    pointer-events:none;
  }
  #wave-badge b{color:var(--ring-inner);font-size:14px;text-shadow:0 0 8px rgba(255,225,77,.5);}
  #lives{display:flex;gap:6px;}
  .life-icon{width:14px;height:16px;}
  #overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(2,2,8,.72);
    backdrop-filter:blur(2px);
  }
  #overlay[hidden]{display:none;}
  .panel{
    width:min(480px,88vw);
    background:linear-gradient(180deg,var(--panel),#060814);
    border:1px solid var(--panel-border);
    border-radius:4px;
    padding:36px 30px 30px;
    text-align:center;
    box-shadow:0 0 0 1px rgba(196,107,255,.08), 0 0 46px rgba(75,227,255,.14), 0 24px 60px rgba(0,0,0,.55);
  }
  .panel h1{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(18px,4vw,26px);
    line-height:1.5;
    margin:0 0 14px;
    color:var(--ship);
    text-shadow:0 0 12px var(--ship-glow), 0 0 32px rgba(75,227,255,.3);
    text-wrap:balance;
  }
  .panel h1.warn{color:var(--core);text-shadow:0 0 12px rgba(255,47,94,.6);}
  .panel h1.win{color:var(--ring-inner);text-shadow:0 0 12px rgba(255,225,77,.6);}
  .panel .sub{color:var(--muted);font-size:12px;letter-spacing:1px;margin-bottom:20px;}
  .panel .stat-row{display:flex;justify-content:center;gap:28px;margin:18px 0;}
  .panel .stat{display:flex;flex-direction:column;gap:4px;}
  .panel .stat .n{font-size:22px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .panel .stat .l{font-size:10px;color:var(--muted);letter-spacing:2px;}
  .controls{
    text-align:left;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:6px 14px;
    font-size:12px;
    color:var(--muted);
    margin:18px 0 6px;
    padding:14px 16px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    border-radius:3px;
  }
  .controls kbd{
    color:var(--ship);
    background:rgba(75,227,255,.08);
    border:1px solid rgba(75,227,255,.35);
    border-radius:3px;
    padding:1px 6px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    justify-self:start;
  }
  .prompt{
    margin-top:22px;
    font-size:12px;
    letter-spacing:2px;
    color:var(--ship);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{0%,55%{opacity:1;}56%,100%{opacity:0;}}
  #start-btn{
    margin-top:18px;
    background:transparent;
    border:1px solid var(--ship);
    color:var(--ship);
    font-family:'Space Mono',monospace;
    font-weight:700;
    letter-spacing:2px;
    font-size:13px;
    padding:10px 22px;
    border-radius:3px;
    cursor:pointer;
    pointer-events:auto;
  }
  #start-btn:hover{background:rgba(75,227,255,.12);}
  #start-btn:focus-visible{outline:2px solid var(--ring-inner);outline-offset:2px;}
  .credit{margin-top:16px;font-size:10px;color:#3d456e;letter-spacing:1px;}

  #touch-controls{
    position:fixed;
    inset:auto 0 0 0;
    display:none;
    justify-content:space-between;
    padding:0 16px 18px;
    pointer-events:none;
  }
  #touch-controls.active{display:flex;}
  .tc-group{display:flex;gap:10px;pointer-events:auto;}
  .tc-btn{
    width:58px;height:58px;
    border-radius:50%;
    border:1px solid rgba(75,227,255,.4);
    background:rgba(10,14,28,.55);
    color:var(--ship);
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
  }
  .tc-btn:active{background:rgba(75,227,255,.25);}
  #fire-btn{width:70px;height:70px;border-color:rgba(255,47,94,.5);color:var(--core);}
  #fire-btn:active{background:rgba(255,47,94,.25);}

  @media (max-width:640px){
    #hud{font-size:11px;padding:12px 14px;}
    #hud .value{font-size:15px;}
  }
</style>

<canvas id="game" aria-label="Fortress Breaker game canvas"></canvas>

<div id="hud" hidden>
  <div class="col left">
    <div class="label">SCORE</div>
    <div class="value" id="score-val">000000</div>
    <div class="label" style="margin-top:8px;">BEST</div>
    <div class="value" id="best-val" style="font-size:13px;color:var(--muted);">000000</div>
  </div>
  <div class="col right">
    <div class="label">SHIPS</div>
    <div id="lives"></div>
  </div>
</div>
<div id="wave-badge" hidden>WAVE <b id="wave-val">1</b></div>

<div id="overlay">
  <div class="panel" id="panel-title">
    <h1>FORTRESS BREAKER</h1>
    <div class="sub">an homage to Cinematronics' Star Castle (1980)</div>
    <div class="controls">
      <kbd>&larr; &rarr;</kbd><span>rotate ship</span>
      <kbd>&uarr;</kbd><span>thrust</span>
      <kbd>SPACE</kbd><span>fire</span>
      <kbd>P</kbd><span>pause</span>
    </div>
    <div style="font-size:11px;color:var(--muted);">Blast through the three rotating rings, dodge mines and the core's killshot, then destroy the core to win.</div>
    <button id="start-btn">LAUNCH</button>
    <div class="credit" id="title-best"></div>
  </div>
</div>

<div id="touch-controls">
  <div class="tc-group">
    <div class="tc-btn" id="tc-left">&#9664;</div>
    <div class="tc-btn" id="tc-right">&#9654;</div>
    <div class="tc-btn" id="tc-thrust">&#9650;</div>
  </div>
  <div class="tc-group">
    <div class="tc-btn" id="fire-btn">FIRE</div>
  </div>
</div>

<script>
(function(){
"use strict";

// ---------- canvas / sizing ----------
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio||1, 2);
var scale = 1;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale = Math.max(0.55, Math.min(1.5, Math.min(W,H)/900));
}
window.addEventListener('resize', resize);
resize();

// ---------- audio (tiny synth, no assets) ----------
var actx = null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; }
  } else if(actx.state === 'suspended'){
    actx.resume().catch(function(){});
  }
}
function tone(freq, dur, type, gain, sweepTo){
  if(!actx) return;
  try{
    var t0 = actx.currentTime;
    var osc = actx.createOscillator();
    var g = actx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if(sweepTo) osc.frequency.linearRampToValueAtTime(sweepTo, t0+dur);
    g.gain.setValueAtTime((gain==null?0.12:gain), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g).connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
function noiseBurst(dur, gain){
  if(!actx) return;
  try{
    var t0 = actx.currentTime;
    var bufSize = Math.floor(actx.sampleRate*dur);
    var buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    var data = buf.getChannelData(0);
    for(var i=0;i<bufSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufSize); }
    var src = actx.createBufferSource();
    src.buffer = buf;
    var g = actx.createGain();
    g.gain.setValueAtTime((gain==null?0.18:gain), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    var filt = actx.createBiquadFilter();
    filt.type='lowpass'; filt.frequency.value=1800;
    src.connect(filt).connect(g).connect(actx.destination);
    src.start(t0);
  }catch(e){}
}
var sfx = {
  shoot: function(){ tone(720,0.07,'square',0.06,420); },
  hit: function(){ tone(220,0.06,'square',0.08,140); },
  segDestroy: function(){ tone(340,0.12,'sawtooth',0.09,90); },
  mineDestroy: function(){ noiseBurst(0.18,0.14); tone(500,0.1,'square',0.06); },
  shipDie: function(){ noiseBurst(0.5,0.22); tone(180,0.5,'sawtooth',0.1,40); },
  killshotCharge: function(){ tone(160,0.42,'sine',0.06,900); },
  killshotFire: function(){ noiseBurst(0.3,0.16); tone(700,0.25,'sawtooth',0.08,120); },
  waveClear: function(){ tone(440,0.12,'square',0.09,660); setTimeout(function(){tone(660,0.16,'square',0.09,880);},110); },
  coreDestroy: function(){ noiseBurst(0.9,0.25); tone(220,0.9,'sawtooth',0.12,60); },
  victory: function(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){tone(f,0.28,'square',0.08);}, i*140); }); },
  gameover: function(){ tone(300,0.6,'sawtooth',0.1,80); }
};

// ---------- input ----------
var keys = {left:false,right:false,thrust:false,fire:false};
var firePressed = false;
window.addEventListener('keydown', function(e){
  if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].indexOf(e.code)!==-1) e.preventDefault();
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left = true;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.right = true;
  if(e.code==='ArrowUp'||e.code==='KeyW') keys.thrust = true;
  if(e.code==='Space'){ keys.fire = true; }
  if(e.code==='KeyP'||e.code==='Escape') togglePause();
  if(e.code==='Enter'){ handleEnter(); }
});
window.addEventListener('keyup', function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left = false;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.right = false;
  if(e.code==='ArrowUp'||e.code==='KeyW') keys.thrust = false;
  if(e.code==='Space'){ keys.fire = false; }
});

function bindHold(el, onDown, onUp){
  if(!el) return;
  var down = function(ev){ ev.preventDefault(); onDown(); };
  var up = function(ev){ ev.preventDefault(); onUp(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('pointercancel', up);
}
if('ontouchstart' in window || navigator.maxTouchPoints>0){
  document.getElementById('touch-controls').classList.add('active');
}
bindHold(document.getElementById('tc-left'), function(){keys.left=true;}, function(){keys.left=false;});
bindHold(document.getElementById('tc-right'), function(){keys.right=true;}, function(){keys.right=false;});
bindHold(document.getElementById('tc-thrust'), function(){keys.thrust=true;}, function(){keys.thrust=false;});
bindHold(document.getElementById('fire-btn'), function(){keys.fire=true;}, function(){keys.fire=false;});

// ---------- constants ----------
var SEG = 16;
var SEG_ANGLE = Math.PI*2/SEG;
var CORE_MAX_HP = 6;
var SLOT_COLOR = ['#ff7a3d','#c46bff','#ffe14d'];
var TWO_PI = Math.PI*2;
function norm(a){ a = a % TWO_PI; if(a<0) a += TWO_PI; return a; }

// ---------- persistent high score ----------
var HS_KEY = 'fortressBreaker.highScore';
function loadHigh(){ try{ return parseInt(localStorage.getItem(HS_KEY)||'0',10)||0; }catch(e){ return 0; } }
function saveHigh(v){ try{ localStorage.setItem(HS_KEY, String(v)); }catch(e){} }
var highScore = loadHigh();

// ---------- game state ----------
var state = 'title'; // title | playing | paused | gameover
var score = 0, lives = 3, wave = 1;
var ship, rings, core, bullets, mines, killshots, particles;
var mineTimer, killshotCooldown, respawnTimer, invuln;
var waveMsgT = 0, waveMsgText = '';
var lastTime = 0;

function freshRing(hpVal){
  var arr = new Array(SEG);
  for(var i=0;i<SEG;i++) arr[i] = hpVal;
  return arr;
}

function baseRadii(){
  return [260*scale, 190*scale, 120*scale];
}

// keeps ring/core geometry in lockstep with the current viewport scale —
// called every frame so a mid-game window resize never leaves stale radii behind
function syncScale(){
  if(!rings) return;
  var radii = baseRadii();
  for(var i=0;i<rings.length;i++){
    rings[i].radius = radii[i];
    rings[i].thickness = 15*scale;
  }
  if(core) core.radius = 46*scale;
}

function initGame(){
  var cx = W/2, cy = H/2;
  score = 0; lives = 3; wave = 1;
  var radii = baseRadii();
  rings = [
    { radius: radii[0], rotation: 0, speed: 0.16, segs: freshRing(2), thickness: 15*scale },
    { radius: radii[1], rotation: Math.random()*TWO_PI, speed: -0.24, segs: freshRing(2), thickness: 15*scale },
    { radius: radii[2], rotation: Math.random()*TWO_PI, speed: 0.34, segs: freshRing(2), thickness: 15*scale }
  ];
  core = { radius: 46*scale, hp: CORE_MAX_HP, maxHp: CORE_MAX_HP, angle: -Math.PI/2, flash:0 };
  ship = {
    x: cx, y: cy - radii[0] - 90*scale,
    vx:0, vy:0, angle: -Math.PI/2,
    radius: 9*scale, alive:true
  };
  bullets = []; mines = []; killshots = []; particles = [];
  mineTimer = 3.2;
  killshotCooldown = 2.2;
  respawnTimer = 0;
  invuln = 2.0;
  waveMsgT = 0;
}

function spawnParticles(x,y,color,count,speedMul,lifeMul){
  count = count||14;
  for(var i=0;i<count;i++){
    var a = Math.random()*TWO_PI;
    var sp = (30+Math.random()*140) * (speedMul||1) * scale;
    particles.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0, maxLife:(0.3+Math.random()*0.5)*(lifeMul||1),
      color:color, size:(1.5+Math.random()*2.2)*scale
    });
  }
}

// ---------- collision helpers ----------
function ringSegAt(ring, angle){
  var local = norm(angle - ring.rotation);
  return Math.floor(local/SEG_ANGLE) % SEG;
}

function checkRingHit(px, py, cx, cy){
  var dx = px-cx, dy = py-cy;
  var r = Math.hypot(dx,dy);
  var ang = Math.atan2(dy,dx);
  for(var i=0;i<rings.length;i++){
    var ring = rings[i];
    var half = ring.thickness/2;
    if(r >= ring.radius-half && r <= ring.radius+half){
      var idx = ringSegAt(ring, ang);
      if(ring.segs[idx] > 0){
        return {ring:ring, idx:idx, ringIndex:i};
      }
    }
  }
  return null;
}

function lineOfSightClear(cx, cy){
  var dx = ship.x-cx, dy = ship.y-cy;
  var dist = Math.hypot(dx,dy);
  var ang = Math.atan2(dy,dx);
  for(var i=0;i<rings.length;i++){
    var ring = rings[i];
    if(ring.radius < dist){
      var idx = ringSegAt(ring, ang);
      if(ring.segs[idx] > 0) return false;
    }
  }
  return true;
}

function ringCleared(ring){
  for(var i=0;i<SEG;i++) if(ring.segs[i] > 0) return false;
  return true;
}

function difficultyBump(){
  rings[0].speed *= (rings[0].speed<0?-1:1) * 1.08 * (rings[0].speed<0?-1:1);
}

function regenerateRings(){
  wave += 1;
  score += 500*wave;
  sfx.waveClear();
  var radii = baseRadii();
  rings[0] = rings[1];
  rings[1] = rings[2];
  rings[2] = { radius: radii[2], rotation: Math.random()*TWO_PI, speed: 0.34*(1+wave*0.06), segs: freshRing(2), thickness: 15*scale };
  rings[0].radius = radii[0];
  rings[1].radius = radii[1];
  rings[0].speed = (rings[0].speed<0?-1:1) * (0.16+wave*0.02);
  rings[1].speed = (rings[1].speed<0?-1:1) * (0.24+wave*0.03);
  mineTimer = Math.min(mineTimer, Math.max(1.4, 3.2 - wave*0.25));
  waveMsgText = 'WAVE ' + wave;
  waveMsgT = 1.8;
}

// destroying the core used to end the whole game with a "victory" screen —
// but there was never a wave 2 to advance into, so every run necessarily
// looped back to wave 1 on restart. real Star Castle (and this homage's own
// ring-regeneration above) treats the core as a milestone, not a finish
// line: blow it up, bank a bonus, and a fresh, harder fortress reassembles
// around the ship. the run only actually ends when the ship runs out of lives.
function advanceWave(){
  wave += 1;
  score += 1000 + wave*150 + lives*100;
  if(score>highScore){ highScore=score; saveHigh(highScore); }
  sfx.coreDestroy();
  setTimeout(function(){ sfx.waveClear(); }, 350);
  spawnParticles(W/2,H/2,'#ffe14d',60,2,1.6);

  var radii = baseRadii();
  var dir0 = Math.random()<0.5 ? -1 : 1;
  var dir1 = Math.random()<0.5 ? -1 : 1;
  rings = [
    { radius: radii[0], rotation: Math.random()*TWO_PI, speed: dir0*(0.16+wave*0.02), segs: freshRing(2), thickness: 15*scale },
    { radius: radii[1], rotation: Math.random()*TWO_PI, speed: dir1*(0.24+wave*0.03), segs: freshRing(2), thickness: 15*scale },
    { radius: radii[2], rotation: Math.random()*TWO_PI, speed: 0.34*(1+wave*0.06), segs: freshRing(2), thickness: 15*scale }
  ];
  // the core itself also toughens up a little each time, capped so it never
  // becomes an unbeatable bullet sponge late-game
  var maxHp = Math.min(14, CORE_MAX_HP + Math.floor((wave-1)/2));
  core = { radius: 46*scale, hp: maxHp, maxHp: maxHp, angle: -Math.PI/2, flash: 0.5 };

  mines = []; killshots = []; bullets = [];
  mineTimer = Math.max(1.4, 3.2 - wave*0.25);
  killshotCooldown = Math.max(1.6, 2.6 - wave*0.15);

  // clean look at the reassembled fortress, spawned back at the same safe
  // spot as a respawn, with enough grace period that materializing rings
  // can't insta-kill a ship that happened to be standing where one re-forms
  var cx=W/2, cy=H/2;
  ship.x = cx; ship.y = cy - radii[0] - 90*scale;
  ship.vx = 0; ship.vy = 0; ship.angle = -Math.PI/2;
  invuln = Math.max(invuln, 1.6);

  waveMsgText = 'FORTRESS DESTROYED — WAVE ' + wave;
  waveMsgT = 2.4;
}

function killShip(){
  if(!ship.alive || invuln>0) return;
  ship.alive = false;
  spawnParticles(ship.x, ship.y, '#4be3ff', 26, 1.3, 1.2);
  sfx.shipDie();
  lives -= 1;
  respawnTimer = 1.3;
}

function respawnShip(){
  var cx=W/2, cy=H/2;
  var radii = baseRadii();
  ship.x = cx; ship.y = cy - radii[0] - 90*scale;
  ship.vx = 0; ship.vy = 0; ship.angle = -Math.PI/2;
  ship.alive = true;
  invuln = 2.2;
}

// ---------- update ----------
function update(dt){
  syncScale();
  var cx=W/2, cy=H/2;

  if(ship.alive){
    if(invuln>0) invuln -= dt;
    if(keys.left) ship.angle -= 3.4*dt;
    if(keys.right) ship.angle += 3.4*dt;
    if(keys.thrust){
      ship.vx += Math.cos(ship.angle) * 260*scale*dt;
      ship.vy += Math.sin(ship.angle) * 260*scale*dt;
    }
    var sp = Math.hypot(ship.vx,ship.vy);
    var maxSp = 360*scale;
    if(sp>maxSp){ ship.vx*=maxSp/sp; ship.vy*=maxSp/sp; }
    var drag = Math.pow(0.62, dt);
    ship.vx *= drag; ship.vy *= drag;
    ship.x += ship.vx*dt; ship.y += ship.vy*dt;
    var margin = 20*scale;
    if(ship.x < -margin) ship.x = W+margin;
    if(ship.x > W+margin) ship.x = -margin;
    if(ship.y < -margin) ship.y = H+margin;
    if(ship.y > H+margin) ship.y = -margin;

    if(keys.fire && ship.fireCd===undefined) ship.fireCd = 0;
    if(ship.fireCd>0) ship.fireCd -= dt;
    if(keys.fire && (ship.fireCd===undefined || ship.fireCd<=0)){
      bullets.push({
        x: ship.x + Math.cos(ship.angle)*ship.radius*1.4,
        y: ship.y + Math.sin(ship.angle)*ship.radius*1.4,
        vx: Math.cos(ship.angle)*560*scale,
        vy: Math.sin(ship.angle)*560*scale,
        life: 1.1
      });
      ship.fireCd = 0.22;
      sfx.shoot();
    }

    if(invuln<=0){
      var hitR = checkRingHit(ship.x, ship.y, cx, cy);
      if(hitR){ killShip(); }
      else if(Math.hypot(ship.x-cx, ship.y-cy) < core.radius+ship.radius*0.6){ killShip(); }
    }
  } else if(respawnTimer>0){
    respawnTimer -= dt;
    if(respawnTimer<=0){
      if(lives>0) respawnShip();
    }
  }

  // rings rotate
  for(var i=0;i<rings.length;i++) rings[i].rotation = norm(rings[i].rotation + rings[i].speed*dt);

  // core tracks ship
  var ang = Math.atan2(ship.y-cy, ship.x-cx);
  core.angle = ang;
  if(core.flash>0) core.flash -= dt;

  // bullets
  for(i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    var steps = 3;
    var removed = false;
    for(var s=0;s<steps && !removed;s++){
      b.x += (b.vx*dt)/steps;
      b.y += (b.vy*dt)/steps;
      var hit = checkRingHit(b.x, b.y, cx, cy);
      if(hit){
        hit.ring.segs[hit.idx] -= 1;
        spawnParticles(b.x,b.y, SLOT_COLOR[hit.ringIndex], 6, 0.7, 0.6);
        if(hit.ring.segs[hit.idx] <= 0){ score += 25; sfx.segDestroy(); if(ringCleared(hit.ring) && hit.ringIndex===0) regenerateRings(); }
        else { score += 10; sfx.hit(); }
        bullets.splice(i,1); removed=true; break;
      }
      var distC = Math.hypot(b.x-cx, b.y-cy);
      if(distC < core.radius){
        core.hp -= 1; core.flash = 0.15;
        score += 100;
        spawnParticles(b.x,b.y,'#ff2f5e',10,1,0.6);
        sfx.hit();
        bullets.splice(i,1); removed=true;
        if(core.hp<=0) advanceWave();
        break;
      }
      for(var m=mines.length-1;m>=0;m--){
        var mn = mines[m];
        if(Math.hypot(b.x-mn.x,b.y-mn.y) < mn.radius+3*scale){
          spawnParticles(mn.x,mn.y,'#ff5b8a',14,1.1,0.8);
          sfx.mineDestroy();
          score += 50;
          mines.splice(m,1);
          bullets.splice(i,1); removed=true;
          break;
        }
      }
    }
    if(!removed){
      b.life -= dt;
      if(b.life<=0 || b.x<-40 || b.x>W+40 || b.y<-40 || b.y>H+40) bullets.splice(i,1);
    }
  }

  // mines
  mineTimer -= dt;
  if(mineTimer<=0){
    mineTimer = Math.max(1.3, 3.2 - wave*0.22) * (0.7+Math.random()*0.6);
    var a0 = Math.random()*TWO_PI;
    mines.push({
      x: cx+Math.cos(a0)*core.radius*0.6, y: cy+Math.sin(a0)*core.radius*0.6,
      vx: Math.cos(a0)*70*scale, vy: Math.sin(a0)*70*scale,
      radius: 8*scale, life: 14, turn: 0.7+Math.min(1.2,wave*0.08)
    });
  }
  for(i=mines.length-1;i>=0;i--){
    var mn2 = mines[i];
    var desiredAng = Math.atan2(ship.y-mn2.y, ship.x-mn2.x);
    var curAng = Math.atan2(mn2.vy,mn2.vx);
    var diff = norm(desiredAng-curAng+Math.PI) - Math.PI;
    curAng += Math.max(-mn2.turn*dt, Math.min(mn2.turn*dt, diff));
    var mineSpCap = Math.min(230, 150+wave*6) * scale;
    var curSp = Math.min(mineSpCap, Math.hypot(mn2.vx,mn2.vy) + 24*scale*dt);
    mn2.vx = Math.cos(curAng)*curSp; mn2.vy = Math.sin(curAng)*curSp;
    mn2.x += mn2.vx*dt; mn2.y += mn2.vy*dt;
    mn2.life -= dt;
    if(mn2.life<=0 || mn2.x<-60||mn2.x>W+60||mn2.y<-60||mn2.y>H+60){ mines.splice(i,1); continue; }
    if(ship.alive && invuln<=0 && Math.hypot(mn2.x-ship.x,mn2.y-ship.y) < mn2.radius+ship.radius){
      spawnParticles(mn2.x,mn2.y,'#ff5b8a',12,1,0.7);
      mines.splice(i,1);
      killShip();
    }
  }

  // killshot
  killshotCooldown -= dt;
  if(killshotCooldown<=0 && ship.alive && killshots.length===0){
    if(lineOfSightClear(cx,cy)){
      sfx.killshotCharge();
      core.flash = 0.5;
      killshots.push({charging:0.42, x:cx, y:cy, vx:0, vy:0, radius: 12*scale, life: 2.6, fired:false});
      killshotCooldown = Math.max(1.3, 2.6 - wave*0.15);
    }
  }
  for(i=killshots.length-1;i>=0;i--){
    var ks = killshots[i];
    if(!ks.fired){
      ks.charging -= dt;
      if(ks.charging<=0){
        var a2 = Math.atan2(ship.y-cy, ship.x-cx);
        var ksSpeed = (620 + Math.min(260, wave*14)) * scale;
        ks.vx = Math.cos(a2)*ksSpeed; ks.vy = Math.sin(a2)*ksSpeed;
        ks.fired = true;
        sfx.killshotFire();
      }
      continue;
    }
    ks.x += ks.vx*dt; ks.y += ks.vy*dt;
    ks.life -= dt;
    if(ship.alive && invuln<=0 && Math.hypot(ks.x-ship.x,ks.y-ship.y) < ks.radius+ship.radius){
      spawnParticles(ks.x,ks.y,'#ff2f5e',20,1.4,0.9);
      killshots.splice(i,1);
      killShip();
      continue;
    }
    if(ks.life<=0 || ks.x<-80||ks.x>W+80||ks.y<-80||ks.y>H+80) killshots.splice(i,1);
  }

  // particles
  for(i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= Math.pow(0.86,dt*60*dt);
    if(p.life>=p.maxLife) particles.splice(i,1);
  }

  if(lives<=0 && !ship.alive && respawnTimer<=0){
    triggerGameOver();
  }

  if(waveMsgT>0) waveMsgT -= dt;
}

// ---------- draw ----------
var stars = [];
function initStars(){
  stars = [];
  var n = Math.floor((W*H)/9000);
  for(var i=0;i<n;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+0.3, tw:Math.random()*Math.PI*2});
  }
}
initStars();
window.addEventListener('resize', function(){ initStars(); });

function glowPath(fn, color, blur){
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.strokeStyle = color;
  fn();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(state!=='title') syncScale();
  var cx=W/2, cy=H/2;

  // stars
  ctx.save();
  for(var i=0;i<stars.length;i++){
    var st = stars[i];
    var tw = 0.55+0.45*Math.sin(st.tw + performance.now()*0.001);
    ctx.fillStyle = 'rgba(200,215,255,'+(0.25*tw+0.08)+')';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, TWO_PI); ctx.fill();
  }
  ctx.restore();

  if(state==='title') return;

  // rings
  for(i=0;i<rings.length;i++){
    var ring = rings[i];
    var color = SLOT_COLOR[i];
    ctx.save();
    ctx.lineWidth = ring.thickness*0.72;
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.lineCap = 'butt';
    for(var s=0;s<SEG;s++){
      if(ring.segs[s] <= 0) continue;
      var a0 = ring.rotation + s*SEG_ANGLE + 0.03;
      var a1 = ring.rotation + (s+1)*SEG_ANGLE - 0.03;
      ctx.globalAlpha = ring.segs[s] >= 2 ? 1 : 0.55;
      ctx.beginPath();
      ctx.arc(cx, cy, ring.radius, a0, a1);
      ctx.stroke();
    }
    ctx.restore();
  }

  // core
  ctx.save();
  var coreGlow = 18 + (core.flash>0 ? 26*Math.min(1,core.flash*3) : 0);
  ctx.translate(cx,cy);
  ctx.rotate(core.angle);
  ctx.shadowColor = '#ff2f5e';
  ctx.shadowBlur = coreGlow;
  ctx.fillStyle = core.flash>0 ? '#ffdfe8' : '#ff2f5e';
  ctx.beginPath();
  var cr = core.radius;
  ctx.moveTo(cr*1.15,0);
  ctx.lineTo(-cr*0.8, cr*0.85);
  ctx.lineTo(-cr*0.45,0);
  ctx.lineTo(-cr*0.8,-cr*0.85);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // core hp ring indicator
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy, core.radius+6*scale, -Math.PI/2, -Math.PI/2 + TWO_PI*(core.hp/(core.maxHp||CORE_MAX_HP)));
  ctx.strokeStyle = 'rgba(255,47,94,.55)';
  ctx.lineWidth = 3*scale;
  ctx.stroke();
  ctx.restore();

  // killshot telegraph ring
  for(i=0;i<killshots.length;i++){
    var ks = killshots[i];
    if(!ks.fired){
      var p = 1 - Math.max(0,ks.charging)/0.42;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,'+(0.3+0.5*p)+')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx,cy, core.radius + 14*scale + p*18*scale, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.fillStyle = '#ff2f5e';
      ctx.shadowColor = '#ff2f5e';
      ctx.shadowBlur = 22;
      ctx.beginPath();
      ctx.arc(ks.x,ks.y,ks.radius,0,TWO_PI);
      ctx.fill();
      ctx.restore();
    }
  }

  // mines
  for(i=0;i<mines.length;i++){
    var mn = mines[i];
    ctx.save();
    ctx.translate(mn.x,mn.y);
    ctx.rotate(performance.now()*0.006);
    ctx.strokeStyle = '#ff5b8a';
    ctx.shadowColor = '#ff5b8a';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(var k=0;k<3;k++){
      var aa = k*(TWO_PI/3);
      ctx.moveTo(Math.cos(aa)*mn.radius, Math.sin(aa)*mn.radius);
      ctx.lineTo(Math.cos(aa+TWO_PI/3)*mn.radius*0.4, Math.sin(aa+TWO_PI/3)*mn.radius*0.4);
    }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,mn.radius*0.35,0,TWO_PI); ctx.fillStyle='#ff5b8a'; ctx.fill();
    ctx.restore();
  }

  // bullets
  ctx.save();
  ctx.fillStyle = '#eaffef';
  ctx.shadowColor = '#9dffb0';
  ctx.shadowBlur = 8;
  for(i=0;i<bullets.length;i++){
    var b = bullets[i];
    ctx.beginPath(); ctx.arc(b.x,b.y,2.6*scale,0,TWO_PI); ctx.fill();
  }
  ctx.restore();

  // particles
  for(i=0;i<particles.length;i++){
    var p2 = particles[i];
    var t = 1-p2.life/p2.maxLife;
    ctx.save();
    ctx.globalAlpha = Math.max(0,t*0+ (1-p2.life/p2.maxLife)*0+ (1-(p2.life/p2.maxLife)));
    ctx.fillStyle = p2.color;
    ctx.beginPath(); ctx.arc(p2.x,p2.y,p2.size*(1-p2.life/p2.maxLife*0.4),0,TWO_PI); ctx.fill();
    ctx.restore();
  }

  // ship
  if(ship.alive && (invuln<=0 || Math.floor(performance.now()/90)%2===0)){
    ctx.save();
    ctx.translate(ship.x,ship.y);
    ctx.rotate(ship.angle);
    ctx.strokeStyle = '#4be3ff';
    ctx.fillStyle = 'rgba(75,227,255,.18)';
    ctx.shadowColor = '#4be3ff';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2;
    var r = ship.radius*1.6;
    ctx.beginPath();
    ctx.moveTo(r,0);
    ctx.lineTo(-r*0.75,r*0.72);
    ctx.lineTo(-r*0.4,0);
    ctx.lineTo(-r*0.75,-r*0.72);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    if(keys.thrust){
      ctx.strokeStyle = '#ffb347';
      ctx.shadowColor = '#ffb347';
      ctx.beginPath();
      ctx.moveTo(-r*0.4,0);
      ctx.lineTo(-r*1.3 - Math.random()*6,0);
      ctx.stroke();
    }
    ctx.restore();
  }

  // wave-advance banner — fades out over its lifetime, never blocks play
  if(waveMsgT>0){
    ctx.save();
    var wt = Math.min(1, waveMsgT/0.5);
    var fadeIn = Math.min(1, (2.4-waveMsgT)/0.3);
    var alpha = Math.min(wt, fadeIn);
    ctx.globalAlpha = Math.max(0,alpha);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '600 '+Math.round(15*scale)+'px "Space Mono", monospace';
    ctx.fillStyle = '#ffe14d';
    ctx.shadowColor = 'rgba(255,225,77,.6)';
    ctx.shadowBlur = 14;
    ctx.fillText(waveMsgText, cx, cy - core.radius - 46*scale);
    ctx.restore();
  }
}

// ---------- HUD ----------
var scoreEl = document.getElementById('score-val');
var bestEl = document.getElementById('best-val');
var livesEl = document.getElementById('lives');
var waveEl = document.getElementById('wave-val');
var hudEl = document.getElementById('hud');
var waveBadge = document.getElementById('wave-badge');

function pad(n){ n=Math.max(0,Math.floor(n)); var s=String(n); while(s.length<6) s='0'+s; return s; }

function renderHud(){
  scoreEl.textContent = pad(score);
  bestEl.textContent = pad(Math.max(highScore,score));
  waveEl.textContent = wave;
  var html='';
  for(var i=0;i<Math.max(0,lives);i++){
    html += '<svg class="life-icon" viewBox="0 0 14 16"><polygon points="12,8 -2,15 2,8 -2,1" fill="none" stroke="#4be3ff" stroke-width="1.5"/></svg>';
  }
  livesEl.innerHTML = html;
}

// ---------- state transitions ----------
var overlay = document.getElementById('overlay');
var panelTitle = document.getElementById('panel-title');
var titleBest = document.getElementById('title-best');

function showTitle(){
  state = 'title';
  overlay.hidden = false;
  hudEl.hidden = true; waveBadge.hidden = true;
  panelTitle.innerHTML =
    '<h1>FORTRESS BREAKER</h1>'+
    '<div class="sub">an homage to Cinematronics\' Star Castle (1980)</div>'+
    '<div class="controls">'+
      '<kbd>&larr; &rarr;</kbd><span>rotate ship</span>'+
      '<kbd>&uarr;</kbd><span>thrust</span>'+
      '<kbd>SPACE</kbd><span>fire</span>'+
      '<kbd>P</kbd><span>pause</span>'+
    '</div>'+
    '<div style="font-size:11px;color:var(--muted);">Blast through the three rotating rings, dodge mines and the core\'s killshot, and bring down the core to advance &mdash; a tougher fortress reassembles around you each time. Survive as many waves as you can.</div>'+
    '<button id="start-btn">LAUNCH</button>'+
    '<div class="credit">BEST '+pad(highScore)+'</div>';
  document.getElementById('start-btn').addEventListener('click', function(){ ensureAudio(); startGame(); });
}

function startGame(){
  ensureAudio();
  initGame();
  state = 'playing';
  overlay.hidden = true;
  hudEl.hidden = false; waveBadge.hidden = false;
}

function togglePause(){
  if(state==='playing'){ state='paused'; overlay.hidden=false; panelTitle.innerHTML = '<h1>PAUSED</h1><div class="sub">press P or ESC to resume</div>'; }
  else if(state==='paused'){ state='playing'; overlay.hidden=true; }
}

function triggerGameOver(){
  state = 'gameover';
  if(score>highScore){ highScore=score; saveHigh(highScore); }
  sfx.gameover();
  overlay.hidden = false;
  panelTitle.innerHTML =
    '<h1 class="warn">SHIP DESTROYED</h1>'+
    '<div class="sub">the fortress holds&hellip;</div>'+
    '<div class="stat-row"><div class="stat"><div class="n">'+pad(score)+'</div><div class="l">SCORE</div></div><div class="stat"><div class="n">'+pad(highScore)+'</div><div class="l">BEST</div></div><div class="stat"><div class="n">'+wave+'</div><div class="l">WAVE</div></div></div>'+
    '<button id="start-btn">RETRY</button>';
  document.getElementById('start-btn').addEventListener('click', function(){ ensureAudio(); startGame(); });
}

function handleEnter(){
  if(state==='title' || state==='gameover'){ startGame(); }
  else if(state==='paused'){ togglePause(); }
}

// ---------- main loop ----------
function loop(ts){
  if(!lastTime) lastTime = ts;
  var dt = Math.min(0.033, (ts-lastTime)/1000);
  lastTime = ts;
  if(state==='playing'){
    update(dt);
    renderHud();
  }
  draw();
  requestAnimationFrame(loop);
}

// ---------- debug hooks (used by automated tests, harmless in normal play) ----------
window.__fortressBreakerDebug = {
  getState: function(){
    return {
      state: state, wave: wave, score: score, lives: lives,
      coreHp: core ? core.hp : null, coreMaxHp: core ? core.maxHp : null,
      ringSpeeds: rings ? rings.map(function(r){return r.speed;}) : null,
      mineTimer: mineTimer, killshotCooldown: killshotCooldown,
      mineCount: mines ? mines.length : 0, waveMsgText: waveMsgText, waveMsgT: waveMsgT
    };
  },
  setCoreHp: function(n){ if(core) core.hp = n; },
  forceCoreDestroyed: function(){ if(core){ core.hp = 0; advanceWave(); } },
  clearRingSegs: function(ringIndex){ if(rings && rings[ringIndex]){ for(var i=0;i<SEG;i++) rings[ringIndex].segs[i]=0; } },
  setInvuln: function(n){ invuln = n; },
  setLives: function(n){ lives = n; },
  killShipNow: function(){ invuln = 0; killShip(); },
  emptyMines: function(){ mines = []; },
  goToWave: function(n){ wave = Math.max(1,n-1); advanceWave(); }
};

showTitle();
requestAnimationFrame(loop);

})();
</script>
